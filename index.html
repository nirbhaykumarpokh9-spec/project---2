<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    

        <div class="profile-container">

            <div class="profile-card">
                <img src="https://wallpapers.com/images/hd/cool-neon-blue-profile-picture-u9y9ydo971k9mdcf.jpg" 
                     alt="Profile picture of Nirbhay">

                <h2 id="nirbhay">Nirbhay Kumar</h2>

                <h3 class="role">Web Developer</h3>

                <p>Passionate about creating modern and friendly websites.</p>
            </div>

            <div class="profile-card">
                <img src="https://media.craiyon.com/2023-10-25/b65f72d6d11a48c1bc560059cc36e31f.webp" 
                     alt="Profile picture of Abhishek">

                <h2 id="sarah">Abhishek Kumar Jha</h2>

                <h3 class="role">PYTHON EXPERT</h3>

                <p>Loves doing Python development and data analysis.</p>
            </div>

            
            <div class="profile-card">
                <img src="https://img.magnific.com/premium-photo/beautiful-anime-boy_1284283-129.jpg?w=2000" 
                     alt="Profile picture of Sahil">

                <h2 id="michael">Sahil Sinha </h2>

                <h3 class="role">Project Manager</h3>

                <p>Focused on teamwork, and delivering successful projects.</p>
            </div>

        </div>
    </section>

</body>
</html>
